name: Auto-merge

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, synchronize, labeled]
  status:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check labels and merge
        run: |
          # --- Resolve PR number ---
          PR_NUMBER=${{ github.event.pull_request.number }}

          # For 'status' events (commit status updates), resolve PR from branch
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            BRANCH_JSON='${{ toJSON(github.event.branches) }}'
            BRANCH_NAME=$(echo "$BRANCH_JSON" | python3 -c "import sys,json; b=json.load(sys.stdin); print(b[0].get('name','') if b else '')" 2>/dev/null || echo "")
            if [ -n "$BRANCH_NAME" ] && [ "$BRANCH_NAME" != "main" ]; then
              PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number // empty' --state open 2>/dev/null || echo "")
            fi
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "No PR context — skipping"
              exit 0
            fi
            echo "Resolved PR #$PR_NUMBER from commit status event"
          fi

          PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')

          # Skip if not a trust:p2/p3 PR
          if ! echo "$PR_LABELS" | grep -qE "trust:p2|trust:p3"; then
            echo "Not a p2/p3 PR — skipping auto-merge"
            exit 0
          fi

          # Check CI status — only merge when all checks are green
          # NOTE: statusCheckRollup includes this workflow's own CheckRun (IN_PROGRESS),
          # so we filter it out to avoid false "still running" detection.
          CHECK_STATUSES=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '
            .statusCheckRollup[]
            | select(.name != "auto-merge" and .name != "auto-merge / auto-merge")
            | .status // empty
          ')
          CHECK_CONCLUSIONS=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '
            .statusCheckRollup[]
            | select(.name != "auto-merge" and .name != "auto-merge / auto-merge")
            | .conclusion // empty
          ')

          # Still running — skip (the check_suite:completed trigger will re-run when checks finish)
          if echo "$CHECK_STATUSES" | grep -qE "^(PENDING|QUEUED|IN_PROGRESS)$"; then
            echo "CI checks still running — will retry when checks complete"
            exit 0
          fi

          # Failures block the merge
          if echo "$CHECK_CONCLUSIONS" | grep -qE "^(FAILURE|TIMED_OUT|CANCELLED|ACTION_REQUIRED)$"; then
            echo "CI checks failed — skipping auto-merge"
            exit 0
          fi

          echo "All CI checks passed — attempting auto-merge"
          gh pr merge "$PR_NUMBER" --admin --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
